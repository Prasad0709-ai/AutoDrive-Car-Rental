# ==============================================================
# AutoDrive Car Rental - Example Configuration File
# Copy this file to application.properties and customize values
# ==============================================================

spring.application.name=car-rental-app
server.port=8080

# --- MySQL 8.x Database Configuration ---
# Create the database first: CREATE DATABASE carrental_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/carrental_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_MYSQL_USERNAME
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Payment Sandbox / Test Credentials ---
# For MOCK mode (runs without third-party credentials):
payment.provider=MOCK

# For Razorpay Sandbox:
# payment.provider=RAZORPAY
# payment.key-id=rzp_test_YOUR_KEY_ID
# payment.key-secret=YOUR_KEY_SECRET

# For Stripe Sandbox:
# payment.provider=STRIPE
# payment.key-id=pk_test_YOUR_KEY
# payment.key-secret=sk_test_YOUR_SECRET
payment.currency=USD
