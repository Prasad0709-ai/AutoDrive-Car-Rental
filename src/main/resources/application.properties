spring.application.name=car-rental-app
server.port=8080

# ==========================================
# Database Configuration (MySQL 8.x Default)
# ==========================================
# Configured with environment variables as specified in Section 23
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carrental_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# Thymeleaf Configuration
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ==========================================
# Payment Architecture Configuration
# ==========================================
# Options: MOCK, RAZORPAY, STRIPE
payment.provider=${PAYMENT_PROVIDER:MOCK}
payment.key-id=${PAYMENT_KEY_ID:rzp_test_mock_key_001}
payment.key-secret=${PAYMENT_KEY_SECRET:rzp_mock_secret_key_001}
payment.currency=${PAYMENT_CURRENCY:USD}

# ==========================================
# Business Rules / Booking Settings
# ==========================================
carrental.app.name=AutoDrive Car Rental
carrental.app.contact-email=support@autodrive.com
carrental.app.contact-phone=+1 (800) 555-0199
carrental.app.cancellation-window-hours=24
