<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Manage Users - Admin')}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid px-lg-5 my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb small mb-1">
                        <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Admin</a></li>
                        <li class="breadcrumb-item active">Users</li>
                    </ol>
                </nav>
                <h2 class="fw-bold mb-0">Registered User Accounts</h2>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
            <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 small">
                    <thead class="table-light text-muted">
                        <tr>
                            <th>User</th>
                            <th>Email Address</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Registration Date</th>
                            <th class="text-end">Account Access</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td>
                                <strong class="d-block text-dark" th:text="${u.fullName}">John Doe</strong>
                                <span class="text-muted" style="font-size: 11px;" th:text="${'@' + u.username}">@customer</span>
                            </td>
                            <td th:text="${u.email}">john@example.com</td>
                            <td th:text="${u.phone != null ? u.phone : 'N/A'}">+1 555-1234</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                      th:text="${u.role}">CUSTOMER</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.isActive} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${u.isActive} ? 'ACTIVE' : 'LOCKED'">ACTIVE</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'MMM dd, yyyy')}">Date</td>
                            <td class="text-end">
                                <form th:action="@{'/admin/users/toggle/' + ${u.id}}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm py-1 px-2"
                                            th:classappend="${u.isActive} ? 'btn-outline-danger' : 'btn-outline-success'">
                                        <i class="fas" th:classappend="${u.isActive} ? 'fa-user-lock' : 'fa-user-check'"></i>
                                        <span th:text="${u.isActive} ? 'Deactivate' : 'Activate'">Action</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
