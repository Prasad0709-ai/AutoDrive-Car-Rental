<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Sign In - AutoDrive Rentals')}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 d-inline-flex justify-content-center align-items-center mb-2" style="width: 56px; height: 56px;">
                            <i class="fas fa-lock fs-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Welcome Back</h3>
                        <p class="text-muted small">Access your bookings and account dashboard</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Invalid credentials</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                        <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}">Logged out</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="Enter username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label small fw-semibold text-muted">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="mb-4 d-flex justify-content-between align-items-center small">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                                <label class="form-check-label text-muted" for="remember-me">Remember me</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                            Sign In to Account <i class="fas fa-arrow-right ms-1"></i>
                        </button>
                    </form>

                    <!-- Development Credentials Helper -->
                    <div class="mt-4 p-3 bg-light rounded-3 border">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="small fw-bold text-dark"><i class="fas fa-code text-primary me-1"></i> Test Credentials:</span>
                            <span class="badge bg-secondary">Demo Mode</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-primary btn-sm flex-fill" onclick="fillCreds('admin', 'admin123')">
                                <i class="fas fa-user-shield me-1"></i> Admin
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" onclick="fillCreds('customer', 'customer123')">
                                <i class="fas fa-user me-1"></i> Customer
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4 text-muted small">
                        Don't have an account yet?
                        <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Create free account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
