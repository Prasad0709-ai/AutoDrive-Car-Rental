<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Create Account - AutoDrive Rentals')}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3 d-inline-flex justify-content-center align-items-center mb-2" style="width: 56px; height: 56px;">
                            <i class="fas fa-user-plus fs-4"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create Customer Account</h3>
                        <p class="text-muted small">Join AutoDrive for instant booking and preferred rental rates</p>
                    </div>

                    <!-- Global Errors -->
                    <div th:if="${#fields.hasErrors('${registrationDto.*}')}" class="alert alert-danger small">
                        <i class="fas fa-exclamation-triangle me-1"></i> Please fix the highlighted errors below before proceeding.
                    </div>

                    <form th:action="@{/register}" th:object="${registrationDto}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">First Name *</label>
                                <input type="text" th:field="*{firstName}" class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" placeholder="John" required>
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Last Name *</label>
                                <input type="text" th:field="*{lastName}" class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" placeholder="Doe" required>
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Username *</label>
                                <input type="text" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" placeholder="johndoe123" required>
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Email Address *</label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="john.doe@example.com" required>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Phone Number</label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+1 (555) 000-0000">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Driver's License Number</label>
                                <input type="text" th:field="*{driversLicense}" class="form-control" placeholder="DL-123456789">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold text-muted">Residential / Billing Address</label>
                                <input type="text" th:field="*{address}" class="form-control" placeholder="123 Main Street, Suite 4B, City, State, ZIP">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Password *</label>
                                <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Min. 6 characters" required>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Confirm Password *</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" placeholder="Re-type password" required>
                                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <div class="form-check mt-3 mb-4 small">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                            <label class="form-check-label text-muted" for="termsCheck">
                                I agree to the <a th:href="@{/terms}" target="_blank" class="text-primary">Terms of Service</a> and rental eligibility conditions.
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                            Complete Registration <i class="fas fa-check-circle ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        Already have an account?
                        <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
