<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Account Settings - AutoDrive')}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="dashboard-sidebar">
                    <nav class="nav flex-column">
                        <a th:href="@{/dashboard}" class="dashboard-sidebar-link">
                            <i class="fas fa-tachometer-alt"></i> Dashboard Overview
                        </a>
                        <a th:href="@{/my-bookings}" class="dashboard-sidebar-link">
                            <i class="fas fa-calendar-alt"></i> My Bookings
                        </a>
                        <a th:href="@{/profile}" class="dashboard-sidebar-link active">
                            <i class="fas fa-user-cog"></i> Account Settings
                        </a>
                    </nav>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <h3 class="fw-bold mb-1">Customer Profile</h3>
                    <p class="text-muted small mb-4">Update your personal information and contact preferences</p>

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
                        <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}">Success</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/profile}" th:object="${profileDto}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{username}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Username</label>
                                <input type="text" th:value="*{username}" class="form-control" disabled>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Email Address *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                                <div class="invalid-feedback d-block" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">First Name *</label>
                                <input type="text" th:field="*{firstName}" class="form-control" required>
                                <div class="invalid-feedback d-block" th:errors="*{firstName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Last Name *</label>
                                <input type="text" th:field="*{lastName}" class="form-control" required>
                                <div class="invalid-feedback d-block" th:errors="*{lastName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Phone Number</label>
                                <input type="tel" th:field="*{phone}" class="form-control" placeholder="+1 (555) 000-0000">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Driver's License Number</label>
                                <input type="text" th:field="*{driversLicense}" class="form-control">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold text-muted">Residential Address</label>
                                <input type="text" th:field="*{address}" class="form-control">
                            </div>
                        </div>

                        <div class="text-end mt-4">
                            <button type="submit" class="btn btn-primary-custom px-4 fw-semibold">
                                <i class="fas fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
