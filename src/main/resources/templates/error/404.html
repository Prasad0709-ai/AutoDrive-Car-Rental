<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Page Not Found (404) - AutoDrive')}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 py-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white mx-auto" style="max-width: 580px;">
            <div class="display-1 fw-bold text-primary mb-2">404</div>
            <h3 class="fw-bold mb-3">Vehicle or Page Not Found</h3>
            <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested vehicle or address could not be found on our server.'}">
                The requested URL could not be located.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/}" class="btn btn-primary-custom btn-sm px-4">
                    <i class="fas fa-home me-1"></i> Return Home
                </a>
                <a th:href="@{/vehicles}" class="btn btn-outline-secondary btn-sm px-4">
                    <i class="fas fa-car me-1"></i> Browse Fleet
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
