<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Payment Processing Notice - AutoDrive')}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5 py-5 text-center">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white mx-auto" style="max-width: 600px;">
            <div class="rounded-circle bg-danger bg-opacity-10 text-danger p-3 d-inline-flex justify-content-center align-items-center mx-auto mb-3" style="width: 72px; height: 72px;">
                <i class="fas fa-credit-card fs-2"></i>
            </div>
            <h3 class="fw-bold mb-2 text-dark">Payment Processing Error</h3>
            <p class="text-danger small mb-4" th:text="${errorMessage}">
                Unable to process the requested transaction.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/my-bookings}" class="btn btn-primary-custom btn-sm px-4">
                    <i class="fas fa-calendar-alt me-1"></i> My Bookings
                </a>
                <a th:href="@{/contact}" class="btn btn-outline-secondary btn-sm px-4">
                    <i class="fas fa-headset me-1"></i> Contact Support
                </a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
