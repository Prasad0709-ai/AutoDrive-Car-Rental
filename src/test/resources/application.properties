spring.application.name=car-rental-app-test

# Use in-memory H2 database configured in MySQL mode for automated JUnit tests
spring.datasource.url=jdbc:h2:mem:test_carrental_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

payment.provider=MOCK
payment.key-id=test_key
payment.key-secret=test_secret
payment.currency=USD
